name: Automated CI Test Suite & Security Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests & Security Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run automated test suite
      env:
        API_KEY: CI_TEST_SUITE_MOCK_API_KEY_12345
        SESSION_SECRET: CI_TEST_SUITE_SESSION_SECRET_987654321_ABC
        VERIFY_SSL: "true"
      run: |
        python tests/test_suite.py

